<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sole Archive · A sneaker showcase built with React</title>
    <meta
      name="description"
      content="A curated archive of classic sneakers shown side by side: filter, search, compare and save pairs. A React portfolio project by Rajveer Singh."
    />
    <meta name="author" content="Rajveer Singh" />
    <meta name="theme-color" content="#f6f5f2" />
    <link rel="canonical" href="https://rajveerrsingh.github.io/sneaker-showcase/" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- first hero slide: lets the browser fetch the LCP image before the bundle runs -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="%PUBLIC_URL%/images/cortez-640.webp 640w, %PUBLIC_URL%/images/cortez.webp 1200w"
      imagesizes="(min-width: 1024px) 58vw, 100vw"
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sole Archive" />
    <meta property="og:title" content="Sole Archive · A sneaker showcase built with React" />
    <meta
      property="og:description"
      content="Classic sneakers, seen in profile. Filter, search, compare and save pairs from Nike, Adidas, Puma and Asics."
    />
    <meta property="og:url" content="https://rajveerrsingh.github.io/sneaker-showcase/" />
    <meta property="og:image" content="https://rajveerrsingh.github.io/sneaker-showcase/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sole Archive: seven classic sneakers lined up in side profile" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sole Archive · A sneaker showcase built with React" />
    <meta
      name="twitter:description"
      content="Classic sneakers, seen in profile. A React portfolio project by Rajveer Singh."
    />
    <meta name="twitter:image" content="https://rajveerrsingh.github.io/sneaker-showcase/og-image.png" />

    <script>
      (function () {
        try {
          var theme = JSON.parse(localStorage.getItem("sa_theme"));
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      html {
        background: #f6f5f2;
      }
      html[data-theme="dark"] {
        background: #0f0f10;
      }
    </style>
  </head>
  <body>
    <noscript>Sole Archive needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
